name: Build Android APK

# mobile/ に変更が入ると APK をビルドし、成果物としてアップロードする。
# Actions の実行ページ → Artifacts から thermal-memo-apk をダウンロードして
# 端末にインストールできる（デバッグ署名済みなのでそのままサイドロード可能）。

on:
  push:
    paths:
      - 'mobile/**'
      - 'thermal_memo/**'
      - 'tests/**'
      - '.github/workflows/android.yml'
  workflow_dispatch:

jobs:
  build:
    name: assembleDebug
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Install Android SDK packages
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-35" "build-tools;35.0.0" > /dev/null

      - name: Unit tests (ESC/POS が Python 版と一致するか)
        working-directory: mobile
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon --stacktrace testDebugUnitTest

      # テストクラスが 1 つも無くても Gradle の test タスクは成功するため、
      # 実際に実行された件数を確認して「素通り」を防ぐ。
      - name: Verify unit tests actually ran
        working-directory: mobile
        run: |
          results=app/build/test-results/testDebugUnitTest
          if [ ! -d "$results" ]; then
            echo "テスト結果ディレクトリがありません: $results"
            exit 1
          fi
          count=$(grep -ho 'tests="[0-9]*"' "$results"/*.xml | grep -o '[0-9]*' | paste -sd+ - | bc)
          echo "実行したテスト数: ${count:-0}"
          test "${count:-0}" -ge 6

      - name: Build debug APK
        working-directory: mobile
        run: ./gradlew --no-daemon --stacktrace assembleDebug

      - name: Upload test report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-report
          path: mobile/app/build/reports/tests/
          if-no-files-found: ignore

      - name: Name the artifact
        working-directory: mobile
        run: cp app/build/outputs/apk/debug/app-debug.apk "thermal-memo-debug-${GITHUB_SHA:0:7}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: thermal-memo-apk
          path: mobile/thermal-memo-debug-*.apk
          if-no-files-found: error
          retention-days: 30

  desktop-tests:
    name: desktop core tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      # QR のデコード検証（OpenCV）まで CI で回すため、任意依存も入れる
      - run: pip install Pillow qrcode opencv-python-headless numpy
      - run: python -c "import cv2, qrcode; print('opencv', cv2.__version__)"
      - run: python -m unittest discover -s tests -v
