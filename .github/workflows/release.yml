name: Release

# v で始まるタグを push すると、各 OS 向けの配布物を作って GitHub Release に添付する。
#
#   git tag v0.1.0 && git push origin v0.1.0
#
# 生成物:
#   thermal-memo-<ver>-windows-setup.exe     Inno Setup 製インストーラ（管理者不要）
#   thermal-memo-<ver>-windows-portable.exe  単一 exe（インストール不要）
#   thermal-memo-<ver>-macos-arm64.dmg       Apple Silicon 向け
#   thermal-memo-<ver>-macos-x86_64.dmg      Intel Mac 向け
#   thermal-memo-<ver>-android.apk           Android 版
#   SHA256SUMS.txt                           自動更新の検証に使う

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'バージョン（例 0.1.0）。タグを作らずに試すとき用'
        required: true
        default: '0.0.0-test'

permissions:
  contents: write

env:
  # Windows ランナーの既定コンソールは cp1252。日本語のログで落ちないようにする
  PYTHONIOENCODING: utf-8
  PYTHONUTF8: '1'

jobs:
  version:
    name: バージョンを決める
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.pick.outputs.version }}
      tag: ${{ steps.pick.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - id: pick
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            tag="${GITHUB_REF_NAME}"
            version="${tag#v}"
          else
            version="${{ inputs.version }}"
            tag="v${version}"
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          echo "リリース: ${tag} (${version})"
      - name: ソースのバージョンとタグが一致するか確認
        if: ${{ !contains(steps.pick.outputs.version, 'test') }}
        run: |
          source_version=$(python -c "import re,pathlib; print(re.search(r'__version__ = \"([^\"]+)\"', pathlib.Path('thermal_memo/__init__.py').read_text()).group(1))")
          echo "thermal_memo/__init__.py: ${source_version}"
          if [ "${source_version}" != "${{ steps.pick.outputs.version }}" ]; then
            echo "::error::タグ ${{ steps.pick.outputs.tag }} と __version__ (${source_version}) が食い違っています"
            exit 1
          fi

  windows:
    name: Windows
    needs: version
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 依存を入れる
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller Pillow qrcode PyMuPDF pdfplumber python-docx
          pip install google-api-python-client google-auth-oauthlib

      - name: onedir をビルド（インストーラ用）
        run: python packaging/build.py --mode onedir --clean

      - name: Inno Setup を入れる
        run: choco install innosetup --no-progress -y

      - name: インストーラを作る
        run: |
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" /DAppVersion=${{ needs.version.outputs.version }} packaging\installer.iss

      - name: onefile をビルド（持ち運び用）
        run: python packaging/build.py --mode onefile

      - name: 名前を整える
        shell: bash
        run: |
          mkdir -p out
          cp dist_installer/thermal-memo-${{ needs.version.outputs.version }}-windows-setup.exe out/
          cp dist/thermal-memo.exe "out/thermal-memo-${{ needs.version.outputs.version }}-windows-portable.exe"
          ls -la out

      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: out/*
          if-no-files-found: error

  # Intel Mac 向けの macos-13 ランナーは GitHub 側で提供が終了しており、
  # ジョブがキューから動かないため対象外にしている。Intel Mac ではソースから
  # 起動してもらう（README 参照）。復活させる場合は matrix に戻すこと。
  macos:
    name: macOS (${{ matrix.arch }})
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-14
            arch: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 依存を入れる
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller Pillow qrcode PyMuPDF pdfplumber python-docx
          pip install google-api-python-client google-auth-oauthlib

      - name: アイコン（.icns）を作る
        run: |
          mkdir -p build/icon.iconset
          for size in 16 32 64 128 256 512; do
            sips -z $size $size assets/icon.png --out build/icon.iconset/icon_${size}x${size}.png > /dev/null
            double=$((size * 2))
            sips -z $double $double assets/icon.png --out build/icon.iconset/icon_${size}x${size}@2x.png > /dev/null
          done
          iconutil -c icns build/icon.iconset -o assets/icon.icns
          ls -la assets/icon.icns

      - name: アプリをビルド
        run: python packaging/build.py --mode onedir --clean --icon assets/icon.icns

      - name: dmg を作る
        run: |
          mkdir -p out
          hdiutil create -volname "thermal.memo" \
            -srcfolder "dist/thermal-memo.app" -ov -format UDZO \
            "out/thermal-memo-${{ needs.version.outputs.version }}-macos-${{ matrix.arch }}.dmg"
          ls -la out

      - uses: actions/upload-artifact@v4
        with:
          name: macos-${{ matrix.arch }}
          path: out/*
          if-no-files-found: error

  android:
    name: Android APK
    needs: version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Android SDK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-35" "build-tools;35.0.0" > /dev/null

      - name: APK をビルド
        working-directory: mobile
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon testDebugUnitTest assembleDebug

      - name: 名前を整える
        run: |
          mkdir -p out
          cp mobile/app/build/outputs/apk/debug/app-debug.apk \
             "out/thermal-memo-${{ needs.version.outputs.version }}-android.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: out/*
          if-no-files-found: error

  publish:
    name: リリースを公開
    needs: [version, windows, macos, android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: staging

      - name: 集めて SHA256SUMS を作る
        run: |
          mkdir -p release
          find staging -type f \( -name '*.exe' -o -name '*.dmg' -o -name '*.apk' \) -exec cp {} release/ \;
          cd release
          sha256sum * > SHA256SUMS.txt
          ls -la
          cat SHA256SUMS.txt

      - name: リリースノートを用意する
        run: |
          version="${{ needs.version.outputs.version }}"
          {
            echo "## thermal.memo ${version}"
            echo
            if [ -f CHANGELOG.md ]; then
              # 該当バージョンの節だけ抜き出す
              awk -v v="## ${version}" '
                $0 ~ "^"v {found=1; next}
                found && /^## / {exit}
                found {print}
              ' CHANGELOG.md
            fi
            echo
            echo "### ダウンロード"
            echo
            echo "| 環境 | ファイル |"
            echo "| --- | --- |"
            echo "| Windows（推奨） | \`thermal-memo-${version}-windows-setup.exe\` — 管理者権限不要のインストーラ |"
            echo "| Windows（持ち運び） | \`thermal-memo-${version}-windows-portable.exe\` — インストール不要の単一 exe |"
            echo "| macOS（Apple Silicon） | \`thermal-memo-${version}-macos-arm64.dmg\` |"
            echo "| macOS（Intel） | 配布物なし。ソースから起動してください（README 参照） |"
            echo "| Android | \`thermal-memo-${version}-android.apk\` |"
            echo
            echo "\`SHA256SUMS.txt\` は自動更新時の検証にも使われます。"
            echo
            echo "> macOS は署名していないため、初回は右クリック →「開く」で許可してください。"
            echo "> Android の APK はデバッグ署名です。「不明なアプリのインストール」の許可が要ります。"
          } > release-notes.md
          cat release-notes.md

      - name: 公開する
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="${{ needs.version.outputs.tag }}"
          if gh release view "$tag" > /dev/null 2>&1; then
            gh release upload "$tag" release/* --clobber
          else
            # タグが未作成なら、このワークフローを動かしたコミットに作る。
            # （タグ push 権限が無い環境から workflow_dispatch で回す場合に必要）
            gh release create "$tag" release/* \
              --target "$GITHUB_SHA" \
              --title "thermal.memo ${{ needs.version.outputs.version }}" \
              --notes-file release-notes.md
          fi
          gh release view "$tag"
