plugins {
    id 'com.android.application'
}

android {
    namespace 'jp.thermalmemo'
    compileSdk 35

    defaultConfig {
        applicationId "jp.thermalmemo"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "0.1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    testOptions {
        unitTests.returnDefaultValues = true
    }
}

dependencies {
    // アプリ本体は AndroidX を含む外部ライブラリを一切使わない。
    // JUnit はユニットテスト専用なので APK には入らない。
    testImplementation 'junit:junit:4.13.2'
}
