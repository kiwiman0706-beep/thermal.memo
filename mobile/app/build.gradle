plugins {
    id 'com.android.application'
}

android {
    namespace 'jp.thermalmemo'
    compileSdk 35

    defaultConfig {
        applicationId "jp.thermalmemo"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "0.1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    // AndroidX を使わない素の SDK だけで組んでいるため dependencies は空
}
